; s3-proto: generic ESP32-S3 devkit N16R8 (16MB quad flash + 8MB OCTAL PSRAM).
; Loaded by ESPuino's platformio.ini via extra_configs; this section MERGES with
; and overrides the stock [env:esp32-s3-devkitc-1].
;
; Why this exists: the pinned platform's esp32-s3-devkitc-1 board def is the
; N8 variant (8MB quad flash, NO PSRAM). Stock env would never enumerate the
; octal PSRAM. See boxes/s3-proto/wiring.md.
;
; NOTE: memory_type is belt-and-braces here — this project builds
; framework = arduino, espidf, so PSRAM enabling actually comes from
; sdkconfig (CONFIG_SPIRAM_MODE_OCT=y in sdkconfig.defaults.esp32s3).
; Do NOT add -mfix-esp32-psram-cache-issue (classic-ESP32 erratum flag).

[env:esp32-s3-devkitc-1]
; The stock env sets `platform = espressif32` (bare name), which overrides the
; [env] pioarduino URL pin. On a machine that already has pioarduino installed
; the bare name happens to resolve to it (pioarduino also calls itself
; "espressif32") — but on a fresh machine it pulls STOCK espressif32 from the
; registry (Arduino 2.0.17 / IDF 4.4.7) and the build breaks (no
; managed_components, ancient core). Pin the S3 profile's hardware-tested
; pioarduino release explicitly; update it only after validating the box.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip ; Arduino 3.3.8 (ESP-IDF 5.5.4)
; ESP32-S3 has no Classic BT; the ESP32-A2DP lib #errors on S3 and PlatformIO's
; LDF compiles it even though our BLUETOOTH_ENABLE is off (chain mode doesn't
; evaluate #ifdefs). Bluetooth.cpp compiles to stubs without it.
lib_ignore = ESP32-A2DP
; The pinned f3eec35 firmware includes NeoPixelBus but omitted it from lib_deps.
; Supply the same v2.8.4 commit used by the D32 profile's firmware revision.
; When updating firmware, remove this addition if its base env already has it.
lib_deps = ${env.lib_deps}
           https://github.com/Makuna/NeoPixelBus.git#fd670ee534064ddf5765e4db63c213ba05bbe880
board_build.arduino.memory_type = qio_opi     ; quad flash + OCTAL psram (NOT opi_opi — that's octal-flash WROOM-2)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = custom_16mb_ota.csv  ; full flash + OTA (stock global is 4MB, no OTA)
; NOTE: this build_flags REPLACES the one in ESPuino's [env:esp32-s3-devkitc-1]
; (extra_configs wins per-option, it does not append), so every flag that env
; sets has to be repeated here - including BOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT,
; which gates the whole firmware-update-over-web path in Web.cpp. Without it the
; ota_0/ota_1 partitions above exist but /update answers "OTA not supported".
build_flags = ${env.build_flags}
              -DHAL=99
              -DBOARD_HAS_PSRAM
              -DLOG_BUFFER_SIZE=10240
              -DBOARD_HAS_16MB_FLASH_AND_OTA_SUPPORT
