; kidbox-lolin-1: WeMos LOLIN D32 Pro V2.0.0 — stock [env:lolin_d32_pro] is
; already correct upstream (HAL=4, PSRAM flags, 16MB flash + OTA partitions),
; so this override intentionally changes nothing. It exists so deploy.sh has a
; profile file to copy, and as the place to pin ports later, e.g.:
;
; [env:lolin_d32_pro]
; upload_port = /dev/cu.usbserial-XXXX   ; or /dev/ttyUSB0 on the Mint box
; monitor_port = /dev/cu.usbserial-XXXX

; NeoPixelBus is pinned in ESPuino's base lib_deps. Do not add another
; env-scoped copy here: PlatformIO will compile both and fail at link time.
[env:lolin_d32_pro]
